<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - DigiLibrary</title>

    <link rel="stylesheet"
          href="/css/style.css">

</head>


<body>


<!-- =========================================================
     REGISTER PAGE
     ========================================================= -->

<div class="login-page">


    <!-- =====================================================
         REGISTER CARD
         ===================================================== -->

    <div class="login-card">


        <!-- =================================================
             LOGO
             ================================================= -->

        <div class="login-logo">

            📖 DigiLibrary

        </div>


        <!-- =================================================
             TITLE
             ================================================= -->

        <h1>

            Create Account

        </h1>


        <p class="login-subtitle">

            Register to access the digital library

        </p>



        <!-- =================================================
             ERROR MESSAGE
             ================================================= -->

        <div th:if="${error}"
             class="error-message"
             th:text="${error}">

            Something went wrong.

        </div>



        <!-- =================================================
             REGISTRATION FORM
             ================================================= -->

        <form action="/register"
              method="post"
              th:object="${user}">


            <!-- NAME -->

            <div class="form-group">

                <label for="name">

                    Full Name

                </label>


                <input type="text"
                       id="name"
                       th:field="*{name}"
                       placeholder="Enter your full name"
                       autocomplete="name"
                       required>

            </div>



            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">

                    Email Address

                </label>


                <input type="email"
                       id="email"
                       th:field="*{email}"
                       placeholder="Enter your email"
                       autocomplete="email"
                       required>

            </div>



            <!-- USERNAME -->

            <div class="form-group">

                <label for="username">

                    Username

                </label>


                <input type="text"
                       id="username"
                       th:field="*{username}"
                       placeholder="Choose a username"
                       autocomplete="username"
                       required>

            </div>



            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">

                    Password

                </label>


                <input type="password"
                       id="password"
                       th:field="*{password}"
                       placeholder="Choose a password"
                       autocomplete="new-password"
                       required>

            </div>



            <!-- USER ROLE -->

            <input type="hidden"
                   th:field="*{role}"
                   value="USER">



            <!-- REGISTER -->

            <button type="submit">

                Create Account

            </button>


        </form>



        <!-- =================================================
             LOGIN LINK
             ================================================= -->

        <p style="text-align: center;
                  margin-top: 20px;
                  font-size: 10px;
                  color: #718096;">

            Already have an account?

            <a href="/login"
               style="color: #1769ff;
                      font-weight: 600;">

                Login here

            </a>

        </p>



        <!-- =================================================
             HOME LINK
             ================================================= -->

        <p style="text-align: center;
                  margin-top: 14px;
                  font-size: 10px;">

            <a href="/"
               style="color: #64748b;">

                ← Back to Home

            </a>

        </p>


    </div>


</div>


</body>

</html>
