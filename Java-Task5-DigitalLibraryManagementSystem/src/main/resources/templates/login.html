<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Digital Library</title>

    <link rel="stylesheet" href="/css/style.css">

</head>

<body>

<div class="container">

    <h1>Library Login</h1>

    <div th:if="${error}"
         class="error-message"
         th:text="${error}">
    </div>

    <div th:if="${success}"
         class="success-message"
         th:text="${success}">
    </div>

    <form action="/login"
          method="post">

        <label>Username</label>

        <input type="text"
               name="username"
               placeholder="Enter username"
               required>

        <label>Password</label>

        <input type="password"
               name="password"
               placeholder="Enter password"
               required>

        <button type="submit">
            Login
        </button>

    </form>

    <p>
        Don't have an account?
        <a href="/register">
            Register here
        </a>
    </p>

    <p>
        <a href="/">
            ← Back to Home
        </a>
    </p>

</div>

</body>
</html>
