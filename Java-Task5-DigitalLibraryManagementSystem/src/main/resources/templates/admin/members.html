<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Members - Digital Library</title>

    <link rel="stylesheet"
          href="/css/style.css">

</head>


<body>

<div class="container"
     style="max-width: 1100px;">

    <!-- ================================================= -->
    <!-- PAGE TITLE -->
    <!-- ================================================= -->

    <h1>Library Members</h1>


    <!-- ================================================= -->
    <!-- WELCOME -->
    <!-- ================================================= -->

    <p>

        Welcome,

        <strong th:text="${admin.name}">
            Admin
        </strong>

    </p>


    <br>


    <!-- ================================================= -->
    <!-- MEMBERS TABLE -->
    <!-- ================================================= -->

    <table border="1"
           width="100%"
           cellpadding="10">

        <thead>

        <tr>

            <th>ID</th>

            <th>Name</th>

            <th>Username</th>

            <th>Email</th>

            <th>Role</th>

            <th>Action</th>

        </tr>

        </thead>


        <tbody>

        <tr th:each="member : ${members}">


            <!-- ID -->

            <td th:text="${member.id}">
                1
            </td>


            <!-- NAME -->

            <td th:text="${member.name}">
                Member Name
            </td>


            <!-- USERNAME -->

            <td th:text="${member.username}">
                username
            </td>


            <!-- EMAIL -->

            <td th:text="${member.email}">
                email@example.com
            </td>


            <!-- ROLE -->

            <td th:text="${member.role}">
                USER
            </td>


            <!-- ACTION -->

            <td>

                <form
                    th:action="@{/admin/members/delete/{id}(id=${member.id})}"
                    method="post"
                    onsubmit="return confirm('Are you sure you want to delete this member?');">

                    <button type="submit">
                        Delete
                    </button>

                </form>

            </td>

        </tr>


        <!-- ================================================= -->
        <!-- NO MEMBERS -->
        <!-- ================================================= -->

        <tr th:if="${#lists.isEmpty(members)}">

            <td colspan="6"
                style="text-align: center;">

                No members found.

            </td>

        </tr>

        </tbody>

    </table>


    <br>


    <!-- ================================================= -->
    <!-- NAVIGATION -->
    <!-- ================================================= -->

    <div class="button-group">

        <a href="/admin/dashboard"
           class="btn">
            Dashboard
        </a>

        <a href="/admin/books"
           class="btn">
            Manage Books
        </a>

        <a href="/admin/issued-books"
           class="btn">
            Issued Books
        </a>

        <a href="/admin/fines"
           class="btn">
            Fine Management
        </a>

        <a href="/admin/queries"
           class="btn">
            Queries
        </a>

        <a href="/logout"
           class="btn">
            Logout
        </a>

    </div>

</div>

</body>

</html>
