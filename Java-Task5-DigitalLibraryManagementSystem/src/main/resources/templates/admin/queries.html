<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Queries - Digital Library</title>

    <link rel="stylesheet" href="/css/style.css">

</head>


<body>

    <div class="container" style="max-width: 1100px;">

        <!-- ================================================= -->
        <!-- PAGE TITLE -->
        <!-- ================================================= -->

        <h1>Manage User Queries</h1>


        <!-- ================================================= -->
        <!-- WELCOME -->
        <!-- ================================================= -->

        <p>

            Welcome,

            <strong th:text="${admin.name}">
                Admin
            </strong>

        </p>


        <br>


        <!-- ================================================= -->
        <!-- QUERY TABLE -->
        <!-- ================================================= -->

        <table border="1" width="100%" cellpadding="10">

            <thead>

                <tr>

                    <th>ID</th>

                    <th>User</th>

                    <th>Message</th>

                    <th>Response</th>

                    <th>Status</th>

                    <th>Created At</th>

                    <th>Action</th>

                </tr>

            </thead>


            <tbody>

                <tr th:each="query : ${queries}">


                    <!-- ID -->

                    <td th:text="${query.id}">
                        1
                    </td>


                    <!-- USER -->

                    <td th:text="${query.user.username}">
                        username
                    </td>


                    <!-- MESSAGE -->

                    <td th:text="${query.message}">
                        User query
                    </td>


                    <!-- RESPONSE -->

                    <td>

                        <span th:if="${query.response != null}" th:text="${query.response}">
                            Response
                        </span>

                        <span th:if="${query.response == null}">
                            No response yet
                        </span>

                    </td>


                    <!-- STATUS -->

                    <td th:text="${query.status}">
                        PENDING
                    </td>


                    <!-- CREATED AT -->

                    <td th:text="${query.createdAt}">
                        Date
                    </td>


                    <!-- ACTION -->

                    <td>

                        <form th:if="${query.response == null}"
                            th:action="@{/admin/queries/respond/{id}(id=${query.id})}" method="post">

                            <textarea name="response" rows="3" cols="25" placeholder="Enter response"
                                required></textarea>

                            <br><br>

                            <button type="submit">
                                Respond
                            </button>

                        </form>


                        <span th:if="${query.response != null}">
                            Responded
                        </span>

                    </td>

                </tr>


                <!-- ================================================= -->
                <!-- NO QUERIES -->
                <!-- ================================================= -->

                <tr th:if="${#lists.isEmpty(queries)}">

                    <td colspan="7" style="text-align: center;">

                        No queries found.

                    </td>

                </tr>

            </tbody>

        </table>


        <br>


        <!-- ================================================= -->
        <!-- NAVIGATION -->
        <!-- ================================================= -->

        <div class="button-group">

            <a href="/admin/dashboard" class="btn">
                Dashboard
            </a>

            <a href="/admin/books" class="btn">
                Manage Books
            </a>

            <a href="/admin/issued-books" class="btn">
                Issued Books
            </a>

            <a href="/admin/fines" class="btn">
                Fine Management
            </a>

            <a href="/admin/members" class="btn">
                Members
            </a>

            <a href="/admin/reservations" class="btn">
                Reservations
            </a>

            <a href="/logout" class="btn">
                Logout
            </a>

        </div>

    </div>

</body>

</html>
