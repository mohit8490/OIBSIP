<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Manage Reservations - Digital Library</title>

    <link rel="stylesheet"
          href="/css/style.css">

</head>


<body>

<div class="container"
     style="max-width: 1100px;">

    <!-- ================================================= -->
    <!-- PAGE TITLE -->
    <!-- ================================================= -->

    <h1>Manage Reservations</h1>


    <!-- ================================================= -->
    <!-- WELCOME -->
    <!-- ================================================= -->

    <p>

        Welcome,

        <strong th:text="${admin.name}">
            Admin
        </strong>

    </p>


    <!-- ================================================= -->
    <!-- RESERVATION TABLE -->
    <!-- ================================================= -->

    <table border="1"
           width="100%"
           cellpadding="10">

        <thead>

        <tr>

            <th>Reservation ID</th>

            <th>User</th>

            <th>Email</th>

            <th>Book ID</th>

            <th>Book</th>

            <th>Author</th>

            <th>Reservation Date</th>

            <th>Status</th>

        </tr>

        </thead>


        <tbody>

        <tr th:each="reservation : ${reservations}">


            <!-- RESERVATION ID -->

            <td th:text="${reservation.id}">
                1
            </td>


            <!-- USER -->

            <td th:text="${reservation.user.username}">
                username
            </td>


            <!-- EMAIL -->

            <td th:text="${reservation.user.email}">
                email@example.com
            </td>


            <!-- BOOK ID -->

            <td th:text="${reservation.book.id}">
                1
            </td>


            <!-- BOOK -->

            <td th:text="${reservation.book.title}">
                Book Title
            </td>


            <!-- AUTHOR -->

            <td th:text="${reservation.book.author}">
                Author
            </td>


            <!-- RESERVATION DATE -->

            <td th:text="${reservation.reservationDate}">
                2026-08-29
            </td>


            <!-- STATUS -->

            <td th:text="${reservation.status}">
                ACTIVE
            </td>

        </tr>


        <!-- ================================================= -->
        <!-- NO RESERVATIONS -->
        <!-- ================================================= -->

        <tr th:if="${#lists.isEmpty(reservations)}">

            <td colspan="8"
                style="text-align: center;">

                No reservations found.

            </td>

        </tr>

        </tbody>

    </table>


    <br>


    <!-- ================================================= -->
    <!-- NAVIGATION -->
    <!-- ================================================= -->

    <div class="button-group">

        <a href="/admin/dashboard"
           class="btn">

            Dashboard

        </a>


        <a href="/admin/books"
           class="btn">

            Manage Books

        </a>


        <a href="/admin/issued-books"
           class="btn">

            Issued Books

        </a>


        <a href="/admin/fines"
           class="btn">

            Fine Management

        </a>


        <a href="/admin/members"
           class="btn">

            Members

        </a>


        <a href="/admin/queries"
           class="btn">

            Queries

        </a>


        <a href="/logout"
           class="btn">

            Logout

        </a>

    </div>

</div>

</body>

</html>
