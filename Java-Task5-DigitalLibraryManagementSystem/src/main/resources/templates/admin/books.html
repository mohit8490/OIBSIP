<!DOCTYPE html>

<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Manage Books - Digital Library</title>

    <link rel="stylesheet"
          href="/css/style.css">

</head>

<body>

<div class="container"
     style="max-width: 1100px;">

    <!-- ================================================= -->
    <!-- PAGE TITLE -->
    <!-- ================================================= -->

    <h1>Manage Books</h1>


    <!-- ================================================= -->
    <!-- WELCOME -->
    <!-- ================================================= -->

    <p>

        Welcome,

        <strong th:text="${admin.name}">
            Admin
        </strong>

    </p>


    <!-- ================================================= -->
    <!-- SUCCESS MESSAGE -->
    <!-- ================================================= -->

    <div th:if="${success}"
         class="success-message">

        <strong>Success:</strong>

        <span th:text="${success}">
            Operation successful.
        </span>

    </div>


    <!-- ================================================= -->
    <!-- ERROR MESSAGE -->
    <!-- ================================================= -->

    <div th:if="${error}"
         class="error-message">

        <strong>Error:</strong>

        <span th:text="${error}">
            Something went wrong.
        </span>

    </div>


    <br>


    <!-- ================================================= -->
    <!-- ADD BOOK -->
    <!-- ================================================= -->

    <a href="/admin/books/add"
       class="btn">

        Add New Book

    </a>


    <br>
    <br>


    <!-- ================================================= -->
    <!-- BOOK TABLE -->
    <!-- ================================================= -->

    <table border="1"
           width="100%"
           cellpadding="10">

        <thead>

        <tr>

            <th>ID</th>

            <th>Title</th>

            <th>Author</th>

            <th>ISBN</th>

            <th>Category</th>

            <th>Total Quantity</th>

            <th>Available Quantity</th>

            <th>Action</th>

        </tr>

        </thead>


        <tbody>

        <tr th:each="book : ${books}">


            <!-- ID -->

            <td th:text="${book.id}">
                1
            </td>


            <!-- TITLE -->

            <td th:text="${book.title}">
                Book Title
            </td>


            <!-- AUTHOR -->

            <td th:text="${book.author}">
                Author
            </td>


            <!-- ISBN -->

            <td th:text="${book.isbn}">
                ISBN
            </td>


            <!-- CATEGORY -->

            <td th:text="${book.category}">
                Category
            </td>


            <!-- TOTAL -->

            <td th:text="${book.quantity}">
                5
            </td>


            <!-- AVAILABLE -->

            <td th:text="${book.availableQuantity}">
                5
            </td>


            <!-- ACTION -->

            <td>

                <!-- EDIT -->

                <a th:href="@{/admin/books/edit/{id}(id=${book.id})}"
                   class="btn">

                    Edit

                </a>


                <!-- DELETE -->

                <form
                    th:action="@{/admin/books/delete/{id}(id=${book.id})}"
                    method="post"
                    style="display: inline;">

                    <button type="submit"
                            onclick="return confirm('Are you sure you want to delete this book?');">

                        Delete

                    </button>

                </form>

            </td>

        </tr>


        <!-- ================================================= -->
        <!-- NO BOOKS -->
        <!-- ================================================= -->

        <tr th:if="${#lists.isEmpty(books)}">

            <td colspan="8"
                style="text-align: center;">

                No books found.

            </td>

        </tr>

        </tbody>

    </table>


    <br>


    <!-- ================================================= -->
    <!-- NAVIGATION -->
    <!-- ================================================= -->

    <div class="button-group">

        <a href="/admin/dashboard"
           class="btn">

            Dashboard

        </a>


        <a href="/admin/issued-books"
           class="btn">

            Issued Books

        </a>


        <a href="/admin/fines"
           class="btn">

            Fine Management

        </a>


        <a href="/admin/members"
           class="btn">

            Members

        </a>


        <a href="/admin/queries"
           class="btn">

            Queries

        </a>


        <a href="/logout"
           class="btn">

            Logout

        </a>

    </div>

</div>

</body>

</html>
